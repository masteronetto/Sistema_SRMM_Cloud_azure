spring:
  application:
    name: srmm-kafka-admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

srmm:
  security:
    azure:
      enabled: ${AZURE_AUTH_ENABLED:false}
      tenant-id: ${AZURE_TENANT_ID:}
      audience: ${AZURE_API_AUDIENCE:}
      required-scope: ${AZURE_REQUIRED_SCOPE:access_as_user}
