spring:
  application:
    name: srmm-kafka-analitica
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

srmm:
  security:
    azure:
      enabled: ${AZURE_AUTH_ENABLED:true}
      tenant-id: ${AZURE_TENANT_ID:}
      audience: ${AZURE_API_AUDIENCE:}
      required-scope: ${AZURE_REQUIRED_SCOPE:access_as_user}
  kafka:
    topics:
      operational-events: ${KAFKA_TOPIC_OPERATIONAL_EVENTS:srmm.eventos-operacionales}
      machinery-state: ${KAFKA_TOPIC_MACHINERY_STATE:srmm.estado-maquinaria}
      operational-dlt: ${KAFKA_TOPIC_OPERATIONAL_DLT:srmm.eventos-operacionales.DLT}
      machinery-state-dlt: ${KAFKA_TOPIC_MACHINERY_STATE_DLT:srmm.estado-maquinaria.DLT}
    consumer:
      analytics-group-id: ${KAFKA_ANALITICA_GROUP_ID:analitica-group}
      audit-group-id: ${KAFKA_AUDITORIA_GROUP_ID:auditoria-group}
      dead-letter-group-id: ${KAFKA_DLT_GROUP_ID:analitica-dlt-group}
      analytics-concurrency: ${KAFKA_ANALITICA_CONCURRENCY:3}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:500}
      session-timeout-ms: ${KAFKA_SESSION_TIMEOUT_MS:45000}
      trusted-packages: ${KAFKA_TRUSTED_PACKAGES:cl.srmm.kafka.bridge.messaging.dto}
    analytics:
      window-duration: ${ANALITICA_WINDOW_DURATION:PT5M}
