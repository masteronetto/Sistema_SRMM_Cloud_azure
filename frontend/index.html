<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SRMM</title>
  <script>
    (function () {
      try {
        const token = sessionStorage.getItem('srmm_token') || localStorage.getItem('srmm_token');
        window.location.replace(token ? '/dashboard.html' : '/login.html');
      } catch (error) {
        window.location.replace('/login.html');
      }
    })();
  </script>
</head>
<body></body>
</html>
