services:
  postgres:
    image: postgres:15-alpine
    container_name: srmm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-srmm_cloud}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/010_cloud_native_base.sql:/docker-entrypoint-initdb.d/01-cloud-native-base.sql
      - ./sql/011_reportes_cloud_native_tables.sql:/docker-entrypoint-initdb.d/02-reportes-cloud-native-tables.sql
    networks:
      - srmm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: srmm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-srmm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local_dev_only}
    # Solo se publica en loopback para pruebas locales; no queda accesible desde Internet.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - srmm-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  srmm-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
