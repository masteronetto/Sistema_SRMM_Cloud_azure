version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: srmm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-srmm_cloud}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/010_cloud_native_base.sql:/docker-entrypoint-initdb.d/01-cloud-native-base.sql
    networks:
      - srmm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  srmm-network:
    driver: bridge

volumes:
  postgres_data:
