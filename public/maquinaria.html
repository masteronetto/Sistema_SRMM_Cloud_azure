<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRMM | Maquinaria</title>
  <meta name="description" content="Vista React de maquinaria SRMM con lectura para todos los roles y edición solo para administradores.">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #f8f5f1 0%, #efe7df 100%);
      color: #1f2937;
    }
    .card-shadow {
      box-shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    function formatCurrency(value) {
      const numeric = Number(value || 0);
      if (!Number.isFinite(numeric)) return '0';
      return new Intl.NumberFormat('es-CL', {
        style: 'currency',
        currency: 'CLP',
        maximumFractionDigits: 0
      }).format(numeric);
    }

    function formatNumber(value, suffix = '') {
      const numeric = Number(value || 0);
      if (!Number.isFinite(numeric)) return `0${suffix}`;
      return `${numeric.toLocaleString('es-CL')}${suffix}`;
    }

    function decodeUserRole() {
      try {
        const token = localStorage.getItem('srmm_token') || '';
        if (!token || !token.includes('.')) return '';
        const payload = token.split('.')[1];
        const parsed = JSON.parse(atob(payload));
        return parsed.rol_acceso || '';
      } catch (error) {
        console.error('Error leyendo rol de usuario', error);
        return '';
      }
    }

    function MaquinariaApp() {
      const [currentRole, setCurrentRole] = useState('');
      const [maquinaria, setMaquinaria] = useState([]);
      const [loading, setLoading] = useState(false);
      const [selectedMachineId, setSelectedMachineId] = useState('');
      const [formMode, setFormMode] = useState('create');
      const [statusMessage, setStatusMessage] = useState('');
      const [formData, setFormData] = useState({
        modelo_equipo: '',
        horometro_actual: '',
        estado: 'Disponible',
        especificaciones: '',
        planes_mantencion_id_plan: '',
        tarifa_diaria: ''
      });

      const isAdmin = useMemo(() => currentRole === 'Administrador', [currentRole]);

      const headers = () => ({
        'Authorization': `Bearer ${localStorage.getItem('srmm_token') || ''}`
      });

      const loadMaquinaria = async () => {
        setLoading(true);
        setStatusMessage('');
        try {
          const response = await fetch('/api/maquinaria', { headers: headers() });
          if (!response.ok) throw new Error('No se pudo cargar la maquinaria');
          const data = await response.json();
          setMaquinaria(Array.isArray(data) ? data : []);
        } catch (error) {
          console.error(error);
          setStatusMessage(error.message || 'Error al cargar maquinaria');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        setCurrentRole(decodeUserRole());
        loadMaquinaria();
      }, []);

      const resetForm = () => {
        setSelectedMachineId('');
        setFormMode('create');
        setFormData({
          modelo_equipo: '',
          horometro_actual: '',
          estado: 'Disponible',
          especificaciones: '',
          planes_mantencion_id_plan: '',
          tarifa_diaria: ''
        });
        setStatusMessage('');
      };

      const selectMachine = (machine) => {
        setSelectedMachineId(machine.id_maquina);
        setFormMode('edit');
        setFormData({
          modelo_equipo: machine.modelo_equipo || '',
          horometro_actual: machine.horometro_actual ?? '',
          estado: machine.estado || 'Disponible',
          especificaciones: machine.especificaciones || '',
          planes_mantencion_id_plan: machine.planes_mantencion_id_plan ?? '',
          tarifa_diaria: machine.tarifa_diaria ?? ''
        });
        setStatusMessage(`Editando ${machine.modelo_equipo}`);
      };

      const handleSubmit = async (event) => {
        event.preventDefault();

        if (!isAdmin) {
          setStatusMessage('No tienes permisos para modificar maquinaria.');
          return;
        }

        if (!formData.modelo_equipo.trim()) {
          setStatusMessage('El modelo es obligatorio');
          return;
        }

        try {
          const payload = {
            modelo_equipo: formData.modelo_equipo.trim(),
            horometro_actual: formData.horometro_actual,
            estado: formData.estado,
            especificaciones: formData.especificaciones.trim(),
            planes_mantencion_id_plan: formData.planes_mantencion_id_plan === '' ? null : formData.planes_mantencion_id_plan,
            tarifa_diaria: formData.tarifa_diaria === '' ? null : formData.tarifa_diaria
          };

          const url = formMode === 'edit' && selectedMachineId ? `/api/maquinaria/${selectedMachineId}` : '/api/maquinaria';
          const method = formMode === 'edit' && selectedMachineId ? 'PUT' : 'POST';

          const response = await fetch(url, {
            method,
            headers: {
              'Content-Type': 'application/json',
              ...headers()
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errorPayload = await response.json().catch(() => ({ message: 'No se pudo guardar la maquinaria' }));
            throw new Error(errorPayload.message || 'No se pudo guardar la maquinaria');
          }

          const saved = await response.json();
          setStatusMessage(formMode === 'edit' ? `Maquinaria actualizada: ${saved.modelo_equipo}` : `Maquinaria creada: ${saved.modelo_equipo}`);
          await loadMaquinaria();
          if (formMode === 'create') {
            resetForm();
          }
        } catch (error) {
          console.error(error);
          setStatusMessage(error.message || 'Error al guardar maquinaria');
        }
      };

      return (
        <div className="max-w-7xl mx-auto p-6 space-y-6">
          <div className="flex items-center justify-between flex-wrap gap-3 border-b pb-4">
            <div>
              <h1 className="text-3xl font-bold text-slate-800">Maquinaria</h1>
              <p className="text-sm text-slate-500 mt-1">Consulta para todos los roles. Edición habilitada solo para Administrador.</p>
            </div>
            <div className="flex gap-2">
              <a href="/dashboard.html" className="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 bg-white">Volver al dashboard</a>
              <button onClick={loadMaquinaria} className="px-4 py-2 rounded-lg bg-slate-800 text-white">Refrescar</button>
            </div>
          </div>

          {statusMessage ? (
            <div className="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-700 card-shadow">{statusMessage}</div>
          ) : null}

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white rounded-2xl p-6 card-shadow">
              <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
                <div>
                  <h2 className="text-xl font-bold text-slate-800">Listado de maquinaria</h2>
                  <p className="text-sm text-slate-500">Los mecánicos ven la información y el admin además puede editarla.</p>
                </div>
                <div className="text-sm text-slate-500">Rol: <span className="font-semibold text-slate-700">{currentRole || 'No detectado'}</span></div>
              </div>

              <div className="overflow-x-auto max-h-[34rem]">
                <table className="w-full min-w-full text-left border-collapse">
                  <thead>
                    <tr className="border-b border-slate-200 text-sm text-slate-500 uppercase">
                      <th className="pb-3 px-2">Modelo</th>
                      <th className="pb-3 px-2 text-center">Estado</th>
                      <th className="pb-3 px-2 text-center">Horómetro</th>
                      <th className="pb-3 px-2 text-right">Tarifa diaria</th>
                      <th className="pb-3 px-2 text-center">Plan</th>
                      <th className="pb-3 px-2 text-center">Acción</th>
                    </tr>
                  </thead>
                  <tbody>
                    {loading ? (
                      <tr><td colSpan="6" className="py-4 text-center text-slate-500">Cargando...</td></tr>
                    ) : maquinaria.length === 0 ? (
                      <tr><td colSpan="6" className="py-4 text-center text-slate-500">No hay maquinaria registrada.</td></tr>
                    ) : (
                      maquinaria.map((machine) => (
                        <tr key={machine.id_maquina} className="border-b border-slate-100 hover:bg-slate-50">
                          <td className="py-3 px-2 font-semibold text-slate-700">{machine.modelo_equipo}</td>
                          <td className="py-3 px-2 text-center">{machine.estado}</td>
                          <td className="py-3 px-2 text-center">{formatNumber(machine.horometro_actual, ' hrs')}</td>
                          <td className="py-3 px-2 text-right">{formatCurrency(machine.tarifa_diaria || 0)}</td>
                          <td className="py-3 px-2 text-center">{machine.planes_mantencion_id_plan || '—'}</td>
                          <td className="py-3 px-2 text-center">
                            {isAdmin ? (
                              <button onClick={() => selectMachine(machine)} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm">Editar</button>
                            ) : (
                              <span className="text-xs font-semibold text-slate-500">Solo lectura</span>
                            )}
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="bg-white rounded-2xl p-6 card-shadow">
              <h2 className="text-xl font-bold text-slate-800 mb-1">{isAdmin ? 'Crear / editar maquinaria' : 'Información de maquinaria'}</h2>
              <p className="text-sm text-slate-500 mb-4">{isAdmin ? 'Solo administradores pueden cambiar tarifas y datos de la máquina.' : 'La edición está bloqueada para tu rol.'}</p>

              <form onSubmit={handleSubmit} className="space-y-4">
                <label className="flex flex-col gap-2">
                  <span className="text-sm font-semibold text-slate-700">Modelo</span>
                  <input
                    type="text"
                    value={formData.modelo_equipo}
                    onChange={(e) => setFormData((prev) => ({ ...prev, modelo_equipo: e.target.value }))}
                    disabled={!isAdmin}
                    className="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 disabled:opacity-70"
                  />
                </label>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <label className="flex flex-col gap-2">
                    <span className="text-sm font-semibold text-slate-700">Horómetro</span>
                    <input
                      type="number"
                      min="0"
                      step="0.01"
                      value={formData.horometro_actual}
                      onChange={(e) => setFormData((prev) => ({ ...prev, horometro_actual: e.target.value }))}
                      disabled={!isAdmin}
                      className="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 disabled:opacity-70"
                    />
                  </label>

                  <label className="flex flex-col gap-2">
                    <span className="text-sm font-semibold text-slate-700">Estado</span>
                    <select
                      value={formData.estado}
                      onChange={(e) => setFormData((prev) => ({ ...prev, estado: e.target.value }))}
                      disabled={!isAdmin}
                      className="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 disabled:opacity-70"
                    >
                      <option value="Disponible">Disponible</option>
                      <option value="Arrendada">Arrendada</option>
                      <option value="Mantencion">Mantención</option>
                      <option value="Bloqueada">Bloqueada</option>
                      <option value="No Operativa">No Operativa</option>
                    </select>
                  </label>
                </div>

                <label className="flex flex-col gap-2">
                  <span className="text-sm font-semibold text-slate-700">Tarifa diaria</span>
                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    value={formData.tarifa_diaria}
                    onChange={(e) => setFormData((prev) => ({ ...prev, tarifa_diaria: e.target.value }))}
                    disabled={!isAdmin}
                    className="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 disabled:opacity-70"
                    placeholder="100000"
                  />
                </label>

                <label className="flex flex-col gap-2">
                  <span className="text-sm font-semibold text-slate-700">Plan mantención ID</span>
                  <input
                    type="number"
                    min="0"
                    step="1"
                    value={formData.planes_mantencion_id_plan}
                    onChange={(e) => setFormData((prev) => ({ ...prev, planes_mantencion_id_plan: e.target.value }))}
                    disabled={!isAdmin}
                    className="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 disabled:opacity-70"
                    placeholder="Opcional"
                  />
                </label>

                <label className="flex flex-col gap-2">
                  <span className="text-sm font-semibold text-slate-700">Especificaciones</span>
                  <textarea
                    value={formData.especificaciones}
                    onChange={(e) => setFormData((prev) => ({ ...prev, especificaciones: e.target.value }))}
                    disabled={!isAdmin}
                    className="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 min-h-[120px] disabled:opacity-70"
                    placeholder="Marca, serie, accesorios, notas técnicas"
                  />
                </label>

                <div className="flex flex-wrap gap-2">
                  <button
                    type="submit"
                    disabled={!isAdmin}
                    className="px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-60"
                  >
                    {formMode === 'edit' ? 'Actualizar' : 'Crear'}
                  </button>
                  <button
                    type="button"
                    onClick={resetForm}
                    className="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-semibold"
                  >
                    Limpiar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MaquinariaApp />);
  </script>
</body>
</html>
