<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SRMM | Iniciar sesión</title>
    <meta name="description" content="Panel de administrador SRMM para inventario, mantenimiento, arriendos, logística, usuarios y reportes." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sistema-srmm.vercel.app/" />
    <meta property="og:site_name" content="Sistema SRMM" />
    <meta property="og:title" content="SRMM | Iniciar sesión" />
    <meta property="og:description" content="Accede al panel de SRMM para gestionar maquinaria, mantenimiento y reportes." />
    <meta property="og:image" content="https://sistema-srmm.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://sistema-srmm.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SRMM | Iniciar sesión" />
    <meta name="twitter:description" content="Accede al panel de SRMM para gestionar maquinaria, mantenimiento y reportes." />
    <meta name="twitter:image" content="https://sistema-srmm.vercel.app/og-image.png" />
    <link rel="icon" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root{ --bg:#f5efe8; --panel:#ffffff; --accent:#6d5141; --accent-strong:#4d372d; --text:#201915; --muted:#7a6c62; }
      *{box-sizing:border-box}
      body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#faf6f2 0%,#f3ede6 100%);color:var(--text);display:grid;place-items:center;min-height:100vh}
      .card{background:var(--panel);border-radius:14px;padding:28px;max-width:420px;width:100%;box-shadow:0 12px 30px rgba(12,10,8,0.06)}
      h1{margin:0 0 10px;font-size:1.35rem}
      p.lead{margin:0 0 18px;color:var(--muted)}
      form{display:grid;gap:12px}
      input{padding:12px 14px;border:1px solid #e9ddd3;border-radius:10px;background:#faf7f4}
      button{background:var(--accent);color:#fff;border:0;padding:12px 14px;border-radius:10px;font-weight:700;cursor:pointer}
      .link{color:var(--accent-strong);text-decoration:none;font-weight:700}
      .small{font-size:0.9rem;color:var(--muted)}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Iniciar sesión</h1>
      <p class="lead">Accede con tu correo y contraseña</p>
      <form id="loginForm" autocomplete="on">
        <input type="email" id="email" name="email" placeholder="Correo electrónico" autocomplete="username" required>
        <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
        <label class="small" style="display:flex;gap:8px;align-items:center;cursor:pointer;user-select:none;">
          <input type="checkbox" id="rememberSession" style="width:auto;margin:0;">
          Mantener sesión iniciada
        </label>
        <button type="submit">Entrar</button>
      </form>
      <p class="small">¿No tienes cuenta? <a class="link" href="/register.html">Regístrate</a></p>
      <p class="small"><a class="link" href="/recover">Recuperar contraseña</a></p>
      <div id="msg" style="margin-top:10px;color:#9f2934;font-weight:700"></div>
    </main>

    <script>
      // Versión estática para capturas: mantiene la experiencia de login pero no fuerza redirección.
      const form = document.getElementById('loginForm');
      const msg = document.getElementById('msg');

      function setAuthToken(token, rememberSession) {
        if (rememberSession) {
          localStorage.setItem('srmm_token', token);
          sessionStorage.removeItem('srmm_token');
          return;
        }

        sessionStorage.setItem('srmm_token', token);
        localStorage.removeItem('srmm_token');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent='';
        const email = document.getElementById('email').value;
        const contrasena = document.getElementById('password').value;
        const rememberSession = document.getElementById('rememberSession').checked;
        try{
          const res = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,contrasena})});
          const data = await res.json();
          if(!res.ok){ msg.textContent = data.message || 'Error'; return; }
          setAuthToken(data.token, rememberSession);
          window.location.href = '/dashboard.html';
        }catch(err){ msg.textContent = 'Error de conexión' }
      });
    </script>
  </body>
</html>
